# Replaces the Makefile's old `cert-manager` target (kubectl apply of the
# upstream release manifest). CRDs are installed via `values.crds.enabled`
# rather than a separate step, matching the upstream chart's own guidance.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: cert-manager
  install:
    createNamespace: true
  chart:
    spec:
      chart: cert-manager
      version: "1.15.x"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  values:
    crds:
      enabled: true
