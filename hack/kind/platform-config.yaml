# Based on syntasso/kratix's hack/platform/kind-platform-config.yaml, plus a
# containerdConfigPatches block so the node picks up registry mirror config
# written to /etc/containerd/certs.d by `make registry` (see kind's local
# registry guide: https://kind.sigs.k8s.io/docs/user/local-registry/).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri".registry]
    config_path = "/etc/containerd/certs.d"
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 31337
    hostPort: 31337
  # for backstage demos
  - containerPort: 31340
    hostPort: 31340
  - containerPort: 31333
    hostPort: 31333
