# Based on syntasso/kratix's hack/destination/kind-worker-config.yaml, plus a
# containerdConfigPatches block so the node picks up registry mirror config
# written to /etc/containerd/certs.d by `make registry` (see kind's local
# registry guide: https://kind.sigs.k8s.io/docs/user/local-registry/).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri".registry]
    config_path = "/etc/containerd/certs.d"
nodes:
- role: control-plane
  extraPortMappings:
  # spare port to be used as nodeport. Used in the demo for exposing nginx ingress
  - containerPort: 31338
    hostPort: 31338
  # Used in the backstage demo for exposing jenkins
  - containerPort: 31339
    hostPort: 31339
  # workshop port for Jenkins (part i) and Kibana (part ii) -- needed for Instruqt
  - containerPort: 30269
    hostPort: 30269
