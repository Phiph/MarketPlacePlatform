apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  creationTimestamp: null
  labels:
    kratix.io/promise-version: v0.2.0
    marketplace.kratix.io/visible: "false"
  annotations:
    marketplace.kratix.io/display-name: Business Unit
    marketplace.kratix.io/description: >-
      Provisions a business unit's Capsule Tenant, with its own resource
      quotas. Teams (see the `team` Promise) get their own namespace inside
      it. Operator/day-2 only - not self-served through the catalog.
    marketplace.kratix.io/owner: platform-team
    marketplace.kratix.io/lifecycle: stable
    marketplace.kratix.io/support: "#platform-eng"
    marketplace.kratix.io/policy: internal
  name: business-unit
spec:
  # Both pipeline stages write to the platform cluster: Capsule's controller
  # and the broker both run there, and platform-cluster is the only
  # Destination registered with `strictMatchLabels: true` (see
  # hack/kratix/platform-values.yaml), so it only receives output that
  # explicitly asks for it via this selector.
  destinationSelectors:
  - matchLabels:
      environment: platform
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      creationTimestamp: null
      name: businessunits.demo.kratix.io
    spec:
      group: demo.kratix.io
      names:
        kind: BusinessUnit
        plural: businessunits
        singular: businessunit
      scope: Namespaced
      versions:
      - name: v1alpha1
        schema:
          openAPIV3Schema:
            properties:
              spec:
                properties:
                  namespaceQuota:
                    type: integer
                    description: >-
                      Max team namespaces this business unit may own.
                      Defaults to 5 if omitted.
                  resourceQuotas:
                    type: object
                    additionalProperties:
                      type: string
                    description: >-
                      Hard resource limits (e.g. cpu, memory, pods) aggregated
                      across every namespace in this business unit - see
                      https://kubernetes.io/docs/concepts/policy/resource-quotas/
                      for the value format. Optional.
                type: object
            type: object
        served: true
        storage: true
    status:
      acceptedNames:
        kind: ""
        plural: ""
      conditions: null
      storedVersions: null
  workflows:
    config: {}
    promise:
      configure:
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: dependencies
        spec:
          containers:
          - image: kratix-guide/business-unit-promise-pipeline:v0.2.0
            name: configure-deps
    resource:
      configure:
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: business-unit-configure
        spec:
          containers:
          - image: kratix-guide/business-unit-resource-pipeline:v0.2.0
            name: kratix-guide-business-unit-resource-pipeline
status:
  workflows: 0
  workflowsFailed: 0
  workflowsSucceeded: 0
